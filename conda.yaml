name: Loan_prediction
channels:
  - conda-forge

# Keep the pip pins in sync with requirements.txt. They are listed here instead of
# `-r requirements.txt` because MLflow names the cached conda env after a hash of
# this file, so a pin change has to show up here to get a fresh env.
dependencies:
  - python=3.12
  - pip
  - pip:
    - mlflow==3.17.2
    - scikit-learn==1.9.1
    - pandas==3.1.0
    - numpy==2.5.4
    - matplotlib==3.11.2
    - skops==0.16.0
